<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEC Grievance Portal — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-dark:#1f6b3a;
    --green:#2e8b47;
    --green-light:#43a047;
    --green-pale:#eaf6ee;
    --ink:#1b2b22;
    --muted:#5c6b62;
    --card:#ffffff;
    --border:#d7e6dc;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(180deg,#f4faf6 0%,#eef7f0 100%);
    color:var(--ink);
    min-height:100vh;
  }
  header.site{
    background:var(--card);
    border-bottom:4px solid var(--green);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand .logo{
    width:52px;height:52px;border-radius:50%;
    background:conic-gradient(var(--green-dark),var(--green-light),var(--green-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;
  }
  .brand h1{font-size:18px;margin:0;color:var(--green-dark);letter-spacing:.3px;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
  .contact{display:flex;gap:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}

  main{
    max-width:420px;
    margin:60px auto;
    padding:0 20px;
  }

  .login-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 14px 40px rgba(30,70,45,.12);
    padding:36px 32px;
    text-align:center;
  }

  .avatar{
    width:140px;height:140px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--green-light), var(--green-dark));
    display:flex;align-items:center;justify-content:center;
  }
  .avatar svg{width:70px;height:70px;fill:#fff;}

  h2{font-size:18px;color:var(--green-dark);margin:0 0 24px;}

  .field{text-align:left;margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:600;color:var(--green-dark);margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    font-family:inherit;
    font-size:13.5px;
    background:#fbfdfc;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(46,139,71,.15);
    background:#fff;
  }

  .btn-row{display:flex;gap:12px;margin-top:22px;}
  .btn{
    flex:1;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-cancel{background:#e0574a;color:#fff;}
  .btn-login{background:linear-gradient(180deg,var(--green-light),var(--green-dark));color:#fff;}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

  .msg{
    margin-top:16px;padding:10px 12px;border-radius:8px;font-size:12.5px;text-align:left;
  }
  .msg.error{background:#fdecea;color:var(--danger);border:1px solid #f4c7c1;}

  footer{text-align:center;font-size:12px;color:var(--muted);padding:30px 20px;}
</style>
</head>
<body>

<header class="site">
  <div class="brand">
    <div class="logo">NEC</div>
    <div>
      <h1>National Engineering College</h1>
      <p>K.R.Nagar, Kovilpatti - 628503</p>
    </div>
  </div>
  <div class="contact">
    <span>✉ principal@nec.edu.in</span>
    <span>📞 04632-232749</span>
    <span>📠 04632-227441</span>
    <a href="index.html" style="color:var(--green-dark);font-weight:600;text-decoration:none;">← Home</a>
  </div>
</header>

<main>
  <div class="login-card">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 8 1.34 8 4v2H4v-2c0-2.66 5.3-4 8-4zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
    </div>
    <h2>Admin Login</h2>

    <form id="loginForm">
      <div class="field">
        <label>UserName</label>
        <input type="text" id="username" placeholder="Enter Username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password" required />
      </div>

      <div id="msgBox"></div>

      <div class="btn-row">
        <button type="button" class="btn btn-cancel" onclick="window.location.href='index.html'">Cancel</button>
        <button type="submit" class="btn btn-login" id="loginBtn">Login</button>
      </div>
    </form>
  </div>
</main>

<footer>National Engineering College — Grievance Redressal Portal</footer>

<script>
const API_BASE = "http://localhost:5000";

const form = document.getElementById("loginForm");
const msgBox = document.getElementById("msgBox");
const loginBtn = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msgBox.innerHTML = "";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    msgBox.innerHTML = '<div class="msg error">Please enter username and password.</div>';
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {
    const res = await fetch(API_BASE + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed.");

    sessionStorage.setItem("nec_admin_token", data.token);
    window.location.href = "admin-dashboard.html";
  } catch (err) {
    msgBox.innerHTML = '<div class="msg error">' + (err.message || "Something went wrong.") + "</div>";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});
</script>

</body>
</html>
